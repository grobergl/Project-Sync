name: Sync External Issues to Project

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and add open issues to project
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          SOURCE_REPO: "drsamps/MakeTheCase"
          PROJECT_OWNER: "grobergl"
          PROJECT_NUMBER: 2
        run: |
          echo "Fetching open issues from $SOURCE_REPO..."

          # Fetch URLs of open issues from the external repository
          ISSUE_URLS=$(gh issue list --repo "$SOURCE_REPO" --state open --limit 50 --json url --jq '.[].url')

          # Loop through each issue URL and add it directly to your project
          for url in $ISSUE_URLS; do
            echo "Adding issue: $url"
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$url" || true
          done

          echo "Sync completed successfully."
